<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Veyra Audit — static security review for AI agents{% endblock %}</title>
<style>
  :root{
    --bg:#0b0b0c;
    --surface:#111113;
    --raised:#17171a;
    --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.14);
    --fg:#ececee;
    --fg2:#a0a0a8;
    --muted:#6e6e78;
    --acc:#e5b04a;
    --acc-ink:#1a1206;
    --crit:#e4685a;
    --high:#e39a4a;
    --med:#d9c05a;
    --low:#8a8a94;
    --safe:#6fbf8c;
    --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
    --sans: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --r-sm:8px; --r-md:12px; --r-lg:16px;
    /* aliases kept for the report template */
    --panel:var(--surface); --panel2:var(--raised); --line2:var(--line-strong);
    --acc2:var(--safe); --bg2:var(--surface); --warn:var(--med); --bad:var(--crit);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:var(--fg);text-decoration:none}
  a:hover{color:#fff}
  code,pre{font-family:var(--mono)}
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px}

  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(11,11,12,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;gap:24px;height:60px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.01em}
  .logo .mark{width:22px;height:22px;border:1px solid var(--line-strong);border-radius:6px;display:grid;place-items:center;
      font:600 12px/1 var(--mono);color:var(--acc)}
  .nav .links{display:flex;gap:22px;margin-left:8px}
  .nav .links a{color:var(--fg2);font-size:14px}
  .nav .links a:hover{color:var(--fg)}
  .nav .sp{flex:1}
  .lang{font:12px/1 var(--mono);letter-spacing:.04em;color:var(--fg2);border:1px solid var(--line);padding:7px 9px;border-radius:var(--r-sm)}
  .lang:hover{color:var(--fg);border-color:var(--line-strong)}

  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-sm);padding:10px 16px;
      font-size:14px;font-weight:500;border:1px solid var(--line-strong);background:var(--raised);color:var(--fg);
      cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .15s ease}
  .btn:hover{background:#1e1e22;border-color:#2a2a30}
  .btn:active{transform:translateY(1px)}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
  .btn.pri:hover{background:#f0bd5c;border-color:#f0bd5c}
  .btn.sm{padding:7px 12px;font-size:13px}
  .btn.ghost{background:transparent;border-color:var(--line)}
  .btn.ghost:hover{background:var(--raised)}

  section{position:relative}
  .hero{padding:76px 0 64px;border-bottom:1px solid var(--line)}
  .kicker{display:inline-flex;align-items:center;gap:8px;font:12px/1 var(--mono);color:var(--fg2);
      border:1px solid var(--line);padding:7px 10px;border-radius:var(--r-sm)}
  .kicker i{width:6px;height:6px;border-radius:50%;background:var(--safe);display:inline-block}
  h1{font-size:clamp(32px,4.6vw,48px);line-height:1.08;letter-spacing:-.03em;margin:20px 0 16px;max-width:22ch;font-weight:600;text-wrap:balance}
  .lead{color:var(--fg2);font-size:16px;max-width:52ch;margin:0 0 26px}
  .hero-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:56px;align-items:center}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .micro{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5}

  /* product preview */
  .preview{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
  .preview .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font:12px/1 var(--mono);color:var(--muted)}
  .preview .bar b{color:var(--fg2);font-weight:500}
  .preview .body{padding:18px}
  .prev-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
  .risk{display:inline-block;font:600 11px/1 var(--mono);letter-spacing:.06em;padding:6px 8px;border-radius:6px}
  .prevsev{font:600 10px/1.4 var(--mono);letter-spacing:.04em}
  .prevsev.crit{color:#ff9d92}
  .prevsev.high{color:#ffc08a}
  .risk.HIGH{color:#ffc9a8;background:rgba(227,154,74,.12);border:1px solid rgba(227,154,74,.32)}
  .risk.CRITICAL{color:#ffb4ab;background:rgba(228,104,90,.12);border:1px solid rgba(228,104,90,.32)}
  .prev-score{font-size:13px;color:var(--muted);font-family:var(--mono)}
  .finding{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .finding .sev{font:600 10px/1 var(--mono);padding-top:3px}
  .finding .t{font-size:13.5px;line-height:1.35}
  .finding .loc{font:11.5px/1.6 var(--mono);color:var(--muted);margin-top:3px}
  .finding .loc em{font-style:normal;color:var(--fg2)}
  .prev-foot{padding:12px 18px;border-top:1px solid var(--line);font:12px/1 var(--mono);color:var(--muted);display:flex;justify-content:space-between}

  /* upload */
  .upload h2{font-size:18px;margin:0 0 6px;font-weight:600}
  .upload p{margin:0 0 16px;color:var(--fg2);font-size:14px}
  .upload label{display:block;font-size:13px;color:var(--fg2);margin-bottom:8px}
  .drop{position:relative;border:1px dashed var(--line-strong);border-radius:var(--r-md);padding:20px;text-align:center;color:var(--fg2);font-size:14px;
      background:var(--surface);cursor:pointer;transition:border-color .15s ease,background .15s ease}
  .drop:hover,.drop.on{border-color:var(--acc);background:#151310}
  .drop b{color:var(--fg);font-weight:500}
  .drop input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
  .picked{display:none;border:1px solid rgba(111,191,140,.3);background:rgba(111,191,140,.06);color:#a9e0c0;
      border-radius:var(--r-md);padding:12px 14px;font:13px/1.4 var(--mono)}

  /* generic section */
  .pad{padding:64px 0;border-bottom:1px solid var(--line)}
  h2.sec{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px}
  .sub{color:var(--fg2);font-size:15px;margin:0 0 28px;max-width:60ch}

  /* checks list */
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;border-top:1px solid var(--line)}
  .check{display:grid;grid-template-columns:20px 1fr;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
  .check svg{width:18px;height:18px;color:var(--muted);margin-top:3px}
  .check h3{font-size:15px;font-weight:500;margin:0 0 3px}
  .check p{margin:0;color:var(--fg2);font-size:13.5px;line-height:1.5}

  /* steps */
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;border-top:1px solid var(--line);padding-top:22px}
  .step .n{font:12px/1 var(--mono);color:var(--acc);margin-bottom:10px}
  .step h3{font-size:15px;font-weight:500;margin:0 0 4px}
  .step p{margin:0;color:var(--fg2);font-size:13.5px}

  /* pricing */
  .price{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .plan{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;background:var(--surface)}
  .plan.hot{background:var(--raised);border-color:var(--line-strong)}
  .plan .tag{font:12px/1 var(--sans);color:var(--muted)}
  .plan .num{font-size:30px;font-weight:600;letter-spacing:-.03em;margin:6px 0 2px}
  .plan .num small{font-size:13px;font-weight:400;color:var(--muted)}
  .plan ul{margin:6px 0 8px;padding-left:16px;color:var(--fg2);font-size:13.5px;display:grid;gap:6px}
  .plan .btn{margin-top:auto;justify-content:center}

  /* faq */
  details{border-bottom:1px solid var(--line);padding:16px 0}
  details summary{cursor:pointer;font-size:15px;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:16px}
  details summary::-webkit-details-marker{display:none}
  details summary:after{content:"+";color:var(--muted);font-family:var(--mono)}
  details[open] summary:after{content:"–"}
  details p{margin:10px 0 0;color:var(--fg2);font-size:14px;max-width:72ch}

  footer{padding:28px 0;color:var(--muted);font-size:12.5px}
  .foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .foot .meta{font-family:var(--mono);font-size:11.5px;display:flex;gap:14px;flex-wrap:wrap}

  .err{border:1px solid rgba(228,104,90,.35);background:rgba(228,104,90,.08);color:#ffb4ab;padding:11px 13px;border-radius:var(--r-sm);margin-bottom:14px;font-size:13.5px}

  /* report page */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
  .card h3{margin:0 0 6px;font-size:15px;font-weight:500}
  .card p{margin:0;color:var(--fg2);font-size:13.5px}
  .sev{font:600 10px/1 var(--mono);letter-spacing:.04em;padding:5px 7px;border-radius:5px;border:1px solid var(--line)}
  .sev.CRITICAL{color:#ffb4ab;border-color:rgba(228,104,90,.35);background:rgba(228,104,90,.1)}
  .sev.HIGH{color:#ffc9a8;border-color:rgba(227,154,74,.35);background:rgba(227,154,74,.1)}
  .sev.MEDIUM{color:#e7d38e;border-color:rgba(217,192,90,.3);background:rgba(217,192,90,.08)}
  .sev.LOW{color:#c3ccd8;border-color:rgba(138,138,148,.3);background:rgba(138,138,148,.1)}
  .sev.SAFE{color:#a9e0c0;border-color:rgba(111,191,140,.35);background:rgba(111,191,140,.08)}
  .badge{font:11px/1 var(--mono);padding:5px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
  .chip{font:11.5px/1 var(--mono);color:var(--fg2);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  @media(max-width:960px){
    .hero-grid{grid-template-columns:1fr;gap:32px}
    .checks{grid-template-columns:1fr;gap:0}
    .steps,.price,.grid3,.grid2{grid-template-columns:1fr}
    .nav .links{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="logo" href="{{ url_for('index') }}"><span class="mark">V</span> Veyra Audit</a>
    <div class="links">
      <a href="{{ url_for('index') }}#checks">{{ t('nav.checks') }}</a>
      <a href="{{ url_for('index') }}#how">{{ t('nav.how') }}</a>
      <a href="{{ url_for('index') }}#pricing">{{ t('nav.pricing') }}</a>
      <a href="{{ url_for('index') }}#faq">{{ t('nav.faq') }}</a>
    </div>
    <div class="sp"></div>
    <a class="lang" href="?lang={{ 'ru' if lang == 'en' else 'en' }}">{{ t('lang.switch') }}</a>
    <a class="btn pri sm" href="{{ url_for('index') }}#scan">{{ t('nav.scan') }}</a>
  </div>
</header>
{% block content %}{% endblock %}
<footer>
  <div class="wrap foot">
    <div>{{ t('footer.line') }}</div>
    <div class="meta">
      <span>{{ t('footer.b1') }}</span>
      <span>{{ t('footer.b2') }}</span>
      <span>{{ t('footer.b3') }}</span>
    </div>
  </div>
</footer>
</body>
</html>
